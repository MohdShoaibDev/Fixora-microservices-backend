spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fixora_products_db
    username: xxxxx
    password: xxxxx
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8083
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_TOKEN_EXPIRE_TIME}
